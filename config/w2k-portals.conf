# The portals Linux 2000 (XDG_CURRENT_DESKTOP=W2K) uses: files are chosen
# in the shell's own Open and Save As dialogs (l2kportal), and the rest --
# settings, printing, opening links -- comes from the GTK back end.
[preferred]
default=gtk
org.freedesktop.impl.portal.FileChooser=w2k
org.freedesktop.impl.portal.Secret=gnome-keyring
